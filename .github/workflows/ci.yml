name: Foundation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'feat/**', 'research/**', 'audit/**']
  workflow_dispatch:

env:
  CARGO_BUILD_JOBS: 2

permissions:
  contents: read

concurrency:
  group: foundation-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Repository foundation and numerical checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify checkout revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git log -1 --format='Tested commit %H'

      - name: Validate required files and repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          required=(README.md LICENSE CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md CHANGELOG.md .editorconfig .gitignore docs/ARCHITECTURE.md docs/ROADMAP.md docs/RESEARCH.md docs/DEVELOPMENT.md docs/COMPUTE_POLICY.md docs/DATASET_POLICY.md docs/EVALUATION.md docs/reports/TASK-006-D1-SCIENTIFIC-EVALUATION.md docs/reports/TASK-006-D1-TEST-EVIDENCE.md docs/reports/TASK-006-D1-SPLIT-LEAKAGE-AUDIT.md docs/reports/TASK-006-D1-OBJECTIVE-A-V2-DATASET.md research/README.md models/README.md datasets/README.md datasets/task006-objective-a-v2/manifest.json datasets/task006-objective-a-v2/sources.jsonl datasets/task006-objective-a-v2/documents.jsonl datasets/task006-objective-a-v2/tokenizer-fit.jsonl datasets/task006-objective-a-v2/tokenizer.tsv datasets/task006-objective-a-v2/task-index.json tools/task006_objective_a_v2.py tools/task006_objective_a_v2_audit.py tools/fixtures/task006-objective-a-v2-audit.json crates/xynoos-data/tests/task006_objective_a_v2.rs benchmarks/README.md experiments/README.md)
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty required file: $file"; exit 1; }
          done
          test -s docs/reports/TASK-003-B-IMPLEMENTATION-REPORT.md
          test -s docs/reports/TASK-004-B-IMPLEMENTATION-REPORT.md
          test -s .github/workflows/ci.yml
          test -s .github/ISSUE_TEMPLATE/bug_report.yml
          test -s .github/ISSUE_TEMPLATE/feature_request.yml
          test -s .github/ISSUE_TEMPLATE/research_proposal.yml
          test -s .github/PULL_REQUEST_TEMPLATE.md
          grep -q 'Apache License' LICENSE
          grep -q 'Version 2.0, January 2004' LICENSE
          if find . -type f \( -name '*.safetensors' -o -name '*.gguf' -o -name '*.ckpt' -o -name '*.bin' \) -print -quit | grep -q .; then
            echo 'Unexpected model binary committed.'
            exit 1
          fi

      - name: Validate Markdown hygiene
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          files = list(Path('.').rglob('*.md'))
          failures = []
          for path in files:
              text = path.read_text(encoding='utf-8')
              if not text.endswith('\n'):
                  failures.append(f'{path}: missing final newline')
              for number, line in enumerate(text.splitlines(), 1):
                  if line.rstrip(' \t') != line and not line.startswith('|'):
                      failures.append(f'{path}:{number}: trailing whitespace')
                  if line.startswith('#') and not re.match(r'^#{1,6} ', line):
                      failures.append(f'{path}:{number}: malformed heading')
          if failures:
              print('\n'.join(failures))
              sys.exit(1)
          print(f'Validated Markdown hygiene in {len(files)} files.')
          PY

      - name: Validate YAML syntax
        shell: ruby {0}
        run: |
          require 'yaml'
          Dir.glob('.github/**/*.yml').each do |path|
            YAML.load_file(path, aliases: true)
            puts "Valid YAML: #{path}"
          end

      - name: Validate tracked privacy and artifact policy
        run: python3 tools/check_repository.py

      - name: Install and verify pinned Rust toolchain
        run: |
          rustup install --no-self-update
          expected_version=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          actual_version=$(rustc --version | cut -d ' ' -f 2)
          test "$actual_version" = "$expected_version"
          rustc --version
          cargo --version
          cargo clippy --version
          cargo fmt --version

      - name: Acquire locked Cargo dependencies
        timeout-minutes: 2
        env:
          CARGO_NET_RETRY: 2
        run: cargo fetch --locked

      - name: Check locked workspace and formatting
        run: |
          cargo metadata --locked --offline --format-version 1 > /dev/null
          cargo fmt --all -- --check

      - name: Run Clippy with warnings denied
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings

      - name: Regenerate and verify independent oracle fixtures
        run: python3 tools/numerical_oracle.py --check

      - name: Regenerate and verify independent gradient and learning fixtures
        run: python3 tools/gradient_oracle.py --check

      - name: Verify independent AdamW numerical oracle
        run: python3 tools/adamw_reference.py --check

      - name: Run auditor-authored native AdamW and weighted-gradient controls
        run: cargo test -p xynoos-autograd --test task006c_independent --locked --offline -- --show-output

      - name: Verify frozen Objective A learning fixture
        run: python3 tools/task006_objective_a.py --check

      - name: Verify independent multi-batch evaluation fixture
        run: python3 tools/task006_evaluation_oracle.py --check

      - name: Verify Objective A split and tokenizer leakage audit
        run: python3 tools/task006_evaluation_audit.py --check

      - name: Verify Objective A v2 corpus and independent audit
        run: |
          python3 tools/task006_objective_a_v2.py --check
          python3 tools/task006_objective_a_v2_audit.py --check

      - name: Regenerate and verify independent tokenizer and dataset fixtures
        run: python3 tools/tokenizer_data_oracle.py --check

      - name: Regenerate and verify independent Transformer fixtures and controls
        timeout-minutes: 2
        run: python3 tools/transformer_oracle.py --check

      - name: Regenerate and verify the independent Gate C oracle
        timeout-minutes: 3
        run: python3 tools/transformer_oracle.py --candidate --check

      - name: Run debug tests and doctests, including all oracles
        shell: bash
        run: |
          set -euo pipefail
          cargo test --workspace --locked --offline -- --show-output | tee "$RUNNER_TEMP/debug-tests.txt"

      - name: Run release tests and doctests, including all oracles
        shell: bash
        run: |
          set -euo pipefail
          cargo test --workspace --release --locked --offline -- --show-output | tee "$RUNNER_TEMP/release-tests.txt"

      - name: Verify bitwise learning trajectory agreement
        shell: bash
        run: |
          set -euo pipefail
          for profile in debug release; do
            grep '^TRAJECTORY ' "$RUNNER_TEMP/$profile-tests.txt" > "$RUNNER_TEMP/$profile-trajectory.txt"
            test "$(wc -l < "$RUNNER_TEMP/$profile-trajectory.txt")" -eq 1
            test "$(wc -w < "$RUNNER_TEMP/$profile-trajectory.txt")" -eq 102
          done
          cmp "$RUNNER_TEMP/debug-trajectory.txt" "$RUNNER_TEMP/release-trajectory.txt"
          digest=$(sha256sum < "$RUNNER_TEMP/debug-trajectory.txt")
          test "${digest%% *}" = e50d201a133838fe64158e0dcf94df894efcf17241f1f16e52232a4e75d41c6a
          printf '%s\n' "$digest"
          echo '101 observations agree bitwise in both Rust profiles.'

      - name: Compare deterministic tokenizer and dataset experiments
        shell: bash
        run: |
          set -euo pipefail
          for profile in debug release; do
            grep '^TASK004_EXPERIMENT [a-f0-9]\{64\}$' "$RUNNER_TEMP/$profile-tests.txt" > "$RUNNER_TEMP/$profile-task004.txt"
            test "$(wc -l < "$RUNNER_TEMP/$profile-task004.txt")" -eq 1
          done
          cmp "$RUNNER_TEMP/debug-task004.txt" "$RUNNER_TEMP/release-task004.txt"
          test "$(cat "$RUNNER_TEMP/debug-task004.txt")" = 'TASK004_EXPERIMENT 3cd12b220e38e423e5dab918b30d86708d64c8fa5fb9c8c1c8168d51bfb8b5d1'
          cat "$RUNNER_TEMP/debug-task004.txt"

      - name: Confirm accepted and added Rust check totals
        run: |
          for profile in debug release; do
            total=$(awk '/^test result: ok[.] / { count += $4 } END { print count }' "$RUNNER_TEMP/$profile-tests.txt")
            test "$total" -eq 180
            printf '%s matches 138 preserved checks, 12 prior TASK 006-R checks, 15 R2 checks, 5 C3 audit checks and 10 D1 evaluation, corpus and baseline checks\n' "$profile"
          done

      - name: Measure isolated Transformer reference passes
        timeout-minutes: 2
        run: |
          for test in mathematical_full_forward_backward_and_tying task004_stream_partial_and_fixed_final_batch; do
            cargo test -p xynoos-transformer --locked --offline --release --test reference "$test" -- --exact --nocapture
          done

      - name: Measure bounded Transformer candidate feasibility
        timeout-minutes: 2
        run: cargo test -p xynoos-transformer --locked --offline --release --test reference candidate_b1_t32 -- --ignored --exact --nocapture

      - name: Verify scoped Gate C backward, finite differences and transactions
        timeout-minutes: 3
        run: |
          for test in full_candidate_b1_t32 candidate_policy_preserves_tighter_work_limit c2_matching_shapes_without_candidate_inventory_identity_are_rejected; do
            cargo test -p xynoos-transformer --locked --offline --release --test reference "candidate::$test" -- --ignored --exact --nocapture
          done
          cargo test -p xynoos-autograd --locked --offline --release --lib tape::transformer::tests::candidate_failures_release_tape_and_preserve_transactions -- --ignored --exact --nocapture

      - name: Run auditor-authored TASK 005-C2 mathematical control
        timeout-minutes: 1
        run: cargo test -p xynoos-transformer --locked --offline --release --test reference candidate::c2_independent_tied_edge_derivative_and_negative_control -- --exact --nocapture

      - name: Build Rust documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked --offline
